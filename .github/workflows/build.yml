name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK 35
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35, build-tools;35.0.0'

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish "latest" release (push on main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            --title "Latest build" \
            --notes "APK le plus récent — build automatique du push sur main." \
            --repo "${{ github.repository }}"

      - name: Publish versioned release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/debug/app-debug.apk \
            --title "$GITHUB_REF_NAME" \
            --notes "Build automatique — APK $GITHUB_REF_NAME." \
            --repo "${{ github.repository }}" \
            || gh release upload "$GITHUB_REF_NAME" app/build/outputs/apk/debug/app-debug.apk \
               --clobber --repo "${{ github.repository }}"
